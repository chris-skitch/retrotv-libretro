<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1640">
<title>RetroTV Remote</title>
<style>
:root {
  --bg: #050b22; --panel: #0a1640; --panel2: #0f1f55; --line: #22336e;
  --gold: #f2c230; --text: #eef1ff; --muted: #8e9acb; --sel: #1c3590; --bad: #ff6b5e; --ok: #63e08a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 10px; }

/* artwork: programme poster, else channel logo, else the channel number */
.art { position: relative; flex: none; align-self: flex-start; width: 96px; height: 54px; border-radius: 4px; overflow: hidden; background: var(--panel2); display: grid; place-items: center; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art.logo img { object-fit: contain; padding: 4px 8px; }
.art span { font: 700 16px var(--mono); color: var(--gold); }
.now .art { width: 112px; height: 63px; align-self: center; }

.now { background: var(--panel); border-top: 3px solid var(--gold); border-radius: 4px; padding: 12px; display: flex; gap: 12px; align-items: stretch; }
.nowt { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.num { font: 700 22px/1 var(--mono); color: var(--gold); text-shadow: 1px 1px 0 #000; }
.name { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--muted); font: 12px var(--mono); display: flex; gap: 10px; align-items: center; }
.nx { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nx:empty { display: none; }
.state { text-transform: uppercase; letter-spacing: .06em; }
.state.playing { color: var(--ok); } .state.nosignal, .state.offline { color: var(--bad); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--gold); width: 0; }

.keys { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
button { font: 700 15px var(--mono); color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 0; cursor: pointer; touch-action: manipulation; }
button:active { background: var(--sel); transform: translateY(1px); }
button[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }

.focus { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
#focus { grid-template-columns: 1fr 1fr 1fr; }
.focus[hidden] { display: none; }
.focus button { padding: 10px 0; font-size: 13px; }
.focus button.on { background: var(--gold); color: #0a1640; border-color: var(--gold); }
.upd { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--gold); border-radius: 6px; font-size: 14px; }
.upd[hidden] { display: none; }
.upd button { padding: 8px 12px; font-size: 13px; flex: 0 0 auto; }
.upd button[hidden] { display: none; }
.settings { margin-top: 10px; background: var(--panel); border-radius: 6px; padding: 4px 12px 10px; }
.settings[hidden] { display: none; }
.row { padding: 8px 0; border-bottom: 1px solid #111d4a; }
.row:last-child { border-bottom: 0; }
.row .lbl { font: 700 12px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; margin-bottom: 6px; }
.row .lbl em { font-style: normal; color: var(--gold); letter-spacing: 0; text-transform: none; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 0 auto; min-width: 3.4em; padding: 9px 8px; font-size: 13px; }
.seg button.on { background: var(--gold); color: #0a1640; border-color: var(--gold); }
.seg .none { color: var(--muted); font-size: 13px; padding: 6px 0; }

.find { width: 100%; margin-top: 10px; padding: 10px 12px; font-size: 16px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.find::placeholder { color: var(--muted); }
.findrow { display: flex; gap: 8px; margin-top: 10px; }
.findrow .find { margin-top: 0; flex: 1; min-width: 0; }
#favs { flex: 0 0 auto; padding: 0 14px; font-size: 18px; }
#favs[hidden] { display: none; }
#favs.on { background: var(--gold); color: #0a1640; border-color: var(--gold); }
li .star { flex: 0 0 auto; align-self: center; background: none; border: 0; padding: 6px 4px; font-size: 22px; color: var(--muted); }
li .star.on { color: var(--gold); }
.msg { margin: 10px 0 0; padding: 8px 12px; border-radius: 4px; background: #3a1018; color: #ffd6d2; font-size: 14px; display: none; }
.msg.show { display: block; }

ul { list-style: none; margin: 6px 0 0; padding: 0; }
li.ch { display: flex; gap: 12px; padding: 10px 8px; border-bottom: 1px solid #111d4a; cursor: pointer; border-radius: 4px; }
li.ch:active, li.ch.on { background: var(--sel); }
li .t { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
li .top .num { font-size: 16px; }
li .cn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr { display: grid; grid-template-columns: 3.1em 1fr; gap: 0 6px; font-size: 13px; align-items: baseline; }
.pr .k { font: 700 10px var(--mono); letter-spacing: .08em; color: var(--gold); }
.pr.px .k { color: var(--muted); }
.pr .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr.px .v { color: var(--muted); }
.pr .tm { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: 4px; }
li .bar { height: 3px; margin: 2px 0 0 calc(3.1em + 6px); }
li .g { color: var(--muted); font: 11px var(--mono); }
li.empty { color: var(--muted); padding: 16px 8px; cursor: default; }
h2 { font: 700 12px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 16px 8px 4px; }
footer { color: var(--muted); font: 12px var(--mono); text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <div class="now" aria-live="polite">
    <div class="art" id="nowart"><span>TV</span></div>
    <div class="nowt">
      <div class="top"><span class="num" id="num">--</span><span class="name" id="name">RetroTV</span></div>
      <div class="prog" id="prog">&nbsp;</div>
      <div class="meta"><span class="state" id="state"></span><span id="times"></span></div>
      <div class="nx" id="nx"></div>
      <div class="bar" id="bar" hidden><i></i></div>
    </div>
  </div>
  <div class="keys">
    <button id="down" aria-label="Channel down">&#9660; CH</button>
    <button id="last" aria-label="Previous channel" data-t>LAST</button>
    <button id="up" aria-label="Channel up">CH &#9650;</button>
    <button id="gear" aria-label="Settings" aria-expanded="false" aria-controls="settings">&#9881;</button>
  </div>
  <div class="focus" id="shift">
    <button id="pp" aria-label="Pause">&#10074;&#10074; PAUSE</button>
    <button id="live" aria-label="Back to live" data-t>LIVE</button>
  </div>
  <div class="focus" id="focus" hidden>
    <button id="f1" aria-label="Control screen 1" data-t>SCREEN 1</button>
    <button id="f2" aria-label="Control screen 2" data-t>SCREEN 2</button>
    <button id="swap" aria-label="Swap the two screens' channels" data-t>SWAP</button>
  </div>
  <div class="settings" id="settings" hidden>
    <div class="row" id="r-pic" hidden><div class="lbl"><span data-t>Settings for</span> <em data-t>audio, leveller, picture</em></div><div class="seg" id="s-pic"></div></div>
    <div class="row"><div class="lbl"><span data-t>Sleep timer</span> <em id="sleepleft"></em></div><div class="seg" id="s-sleep"></div></div>
    <div class="row"><div class="lbl" data-t>Audio track</div><div class="seg" id="s-audio"></div></div>
    <div class="row"><div class="lbl" data-t>Volume leveller</div><div class="seg" id="s-leveller"></div></div>
    <div class="row"><div class="lbl" data-t>Picture</div><div class="seg" id="s-picture"></div></div>
    <div class="row" id="r-output"><div class="lbl" data-t>Output</div><div class="seg" id="s-output"></div></div>
    <div class="row" id="r-screen2" hidden><div class="lbl" data-t>Screen 2</div><div class="seg" id="s-screen2"></div></div>
  </div>
  <div class="upd" id="upd" hidden><span id="updtxt"></span><button id="updbtn" data-t>INSTALL</button></div>
  <div class="msg" id="msg"></div>
</header>
<main>
  <div class="findrow">
    <input class="find" id="find" type="search" placeholder="Find a channel or programme" autocomplete="off" aria-label="Find a channel or programme">
    <button id="favs" aria-pressed="false" aria-label="Show favourites only">&#9733;</button>
  </div>
  <ul id="list"></ul>
</main>
<footer data-t>RetroTV remote · tap a channel to watch it, ☆ to make it a favourite</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);

/* ---------- language: the phone's (Spanish phone: Spanish page) ---------- */
/* keyed by the English used below; scripts/check-lang.py checks each t() call and data-t text has one */
const ES = {
  "RetroTV Remote": "Mando RetroTV",
  "Channel down": "Canal abajo",
  "Previous channel": "Canal anterior",
  "Channel up": "Canal arriba",
  "Settings": "Ajustes",
  "Pause": "Pausa",
  "Play": "Seguir",
  "Back to live": "Volver al directo",
  "Control screen 1": "Controlar la pantalla 1",
  "Control screen 2": "Controlar la pantalla 2",
  "Swap the two screens' channels": "Intercambiar los canales de las dos pantallas",
  "Find a channel or programme": "Buscar un canal o programa",
  "Show favourites only": "Ver solo favoritos",
  "LAST": "ANTERIOR",
  "LIVE": "DIRECTO",
  "LIVE ({t})": "DIRECTO ({t})",
  "PLAY": "SEGUIR",
  "PAUSE": "PAUSA",
  "SCREEN 1": "PANTALLA 1",
  "SCREEN 2": "PANTALLA 2",
  "SWAP": "CAMBIAR",
  "INSTALL": "INSTALAR",
  "TRY AGAIN": "REINTENTAR",
  "Settings for": "Ajustes de",
  "audio, leveller, picture": "audio, nivelador, imagen",
  "Sleep timer": "Apagado autom\u00e1tico",
  "Audio track": "Pista de audio",
  "Volume leveller": "Nivelador de volumen",
  "Picture": "Imagen",
  "Output": "Salida",
  "Screen 2": "Pantalla 2",
  "Screen {n}": "Pantalla {n}",
  "RetroTV remote \u00b7 tap a channel to watch it, \u2606 to make it a favourite": "Mando RetroTV \u00b7 toca un canal para verlo y \u2606 para hacerlo favorito",
  "NOW": "AHORA",
  "NEXT": "LUEGO",
  "Next": "Luego",
  "Other": "Otros",
  "No guide": "Sin gu\u00eda",
  "No match": "Nada coincide",
  "No favourites yet: tap \u2605 to show every channel, then \u2606 on one": "A\u00fan no hay favoritos: toca \u2605 para ver todos los canales y luego \u2606 en uno",
  "Add {name} to favourites": "A\u00f1adir {name} a favoritos",
  "Remove {name} from favourites": "Quitar {name} de favoritos",
  "Favourite: {e}": "Favorito: {e}",
  "Channel list: {e}": "Lista de canales: {e}",
  "Settings: {e}": "Ajustes: {e}",
  "RetroTV {v} is available": "RetroTV {v} disponible",
  "Downloading RetroTV {v}\u2026": "Descargando RetroTV {v}\u2026",
  "Installing RetroTV {v}\u2026": "Instalando RetroTV {v}\u2026",
  "RetroTV {v} installed: reopen RetroTV to use it": "RetroTV {v} instalado: vuelve a abrir RetroTV para usarlo",
  "RetroTV {v} installed: restart ReplayOS to finish": "RetroTV {v} instalado: reinicia ReplayOS para terminar",
  "The update didn't install": "La actualizaci\u00f3n no se instal\u00f3",
  "RetroTV isn't answering. Is it running? ({e})": "RetroTV no responde. \u00bfEst\u00e1 encendido? ({e})",
  "Only one track on this channel": "Este canal solo tiene una pista",
  "{n} min left": "quedan {n} min",
  "Off": "No",
  "On": "S\u00ed",
  "Normal": "Normal",
  "Loud": "Alto",
  "Fit": "Ajustar",
  "Zoom": "Zoom",
  "connecting": "conectando",
  "offline": "sin conexi\u00f3n",
  "tuning": "sintonizando",
  "playing": "en antena",
  "no signal": "sin se\u00f1al",
  "off": "apagado",
  "test card": "carta de ajuste",
  "no channels": "sin canales",
};
const LANG = /^es\b/i.test(navigator.language || "") ? "es" : "en";
/* English text in the phone's language; {name} placeholders filled from a */
function t(en, a) {
  let r = (LANG === "es" && ES[en]) || en;
  for (const k in a || {}) r = r.split("{" + k + "}").join(a[k]);
  return r;
}
/* the TV's states in /status */
const STATE = { tuning: t("tuning"), playing: t("playing"), "no signal": t("no signal"), off: t("off"),
                "test card": t("test card"), "no channels": t("no channels") };
function translatePage() {
  document.documentElement.lang = LANG;
  document.title = t("RetroTV Remote");
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.textContent);
  for (const e of document.querySelectorAll("[aria-label]")) e.setAttribute("aria-label", t(e.getAttribute("aria-label")));
  for (const e of document.querySelectorAll("[placeholder]")) e.placeholder = t(e.placeholder);
}
let chans = [], current = null, filter = "", settings = null, favOnly = false, favsOn = false;
try { favOnly = localStorage.getItem("retrotv-favs") === "1"; } catch (e) { /* private window */ }
let pic = 0;                                         /* two screens: whose audio/leveller/picture the panel shows (0 = the focused one) */
const PER_PICTURE = ["audio", "leveller", "picture"];

function hhmm(t) {
  return new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function frac(p) {
  if (!p || p.stop <= p.start) return 0;
  return Math.min(1, Math.max(0, (Date.now() / 1000 - p.start) / (p.stop - p.start)));
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function setBar(bar, p) {
  bar.hidden = !p;
  if (p) bar.firstChild.style.width = (frac(p) * 100).toFixed(1) + "%";
}
function showMsg(t) { $("msg").textContent = t || ""; $("msg").classList.toggle("show", !!t); }

/* poster -> channel logo -> channel number, falling back when an image fails */
function fillArt(box, c, prog) {
  const tries = [];
  if (prog && prog.icon) tries.push([prog.icon, ""]);
  if (c && c.logo) tries.push([c.logo, "logo"]);
  const key = tries.map(t => t[0]).join("|");
  if (box.dataset.key === key && box.firstChild) return;   /* unchanged: keep the loaded image */
  box.dataset.key = key;
  const next = () => {
    box.textContent = "";
    const t = tries.shift();
    if (!t) { box.className = "art"; box.appendChild(el("span", null, c ? c.ch : "TV")); return; }
    box.className = "art" + (t[1] ? " " + t[1] : "");
    const img = el("img");
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.onerror = next;
    img.src = t[0];
    box.appendChild(img);
  };
  next();
}

async function call(path) {
  const r = await fetch(path, { cache: "no-store" });
  const j = await r.json().catch(() => ({ ok: false, error: "bad reply" }));
  if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function progLine(kind, p) {
  const d = el("div", "pr " + (kind === "now" ? "pn" : "px"));   /* not "now": that's the header panel */
  d.appendChild(el("span", "k", kind === "now" ? t("NOW") : t("NEXT")));
  const v = el("span", "v");
  v.appendChild(el("span", "tm", hhmm(p.start)));
  v.appendChild(document.createTextNode(p.title));
  d.appendChild(v);
  return d;
}

function render() {
  const list = $("list");
  list.textContent = "";
  const q = filter.trim().toLowerCase();
  let group = null;
  /* headings only when the playlist is sorted by group (each group in one run) */
  const runs = chans.filter((c, i) => i === 0 || (c.group || "") !== (chans[i - 1].group || "")).length;
  const groups = new Set(chans.map(c => c.group || ""));
  const headed = groups.size > 1 && runs === groups.size;
  for (const c of chans) {
    const hay = [c.ch, c.name, c.group, c.now && c.now.title, c.next && c.next.title].join(" ").toLowerCase();
    if (q && !hay.includes(q)) continue;
    if (favsOn && favOnly && !c.fav) continue;
    if (headed && (c.group || "") !== group) {
      group = c.group || "";
      list.appendChild(el("h2", null, group || t("Other")));
    }
    const li = el("li", "ch" + (c.ch === current ? " on" : ""));
    const art = el("div", "art");
    fillArt(art, c, c.now);
    li.appendChild(art);
    const info = el("div", "t");
    const top = el("div", "top");
    top.appendChild(el("span", "num", c.ch));
    top.appendChild(el("span", "cn", c.name));
    info.appendChild(top);
    if (c.now) {
      info.appendChild(progLine("now", c.now));
      const b = el("div", "bar"); b.appendChild(el("i")); info.appendChild(b); setBar(b, c.now);
    }
    if (c.next) info.appendChild(progLine("next", c.next));
    if (!c.now && !c.next) info.appendChild(el("div", "g", c.group || t("No guide")));
    else if (!headed && c.group) info.appendChild(el("div", "g", c.group));
    li.appendChild(info);
    const st = el("button", "star" + (c.fav ? " on" : ""), c.fav ? "\u2605" : "\u2606");
    st.setAttribute("aria-label", c.fav ? t("Remove {name} from favourites", { name: c.name }) : t("Add {name} to favourites", { name: c.name }));
    st.onclick = async e => {
      e.stopPropagation();                                 /* a star isn't a tune */
      try {
        await call("/fav?ch=" + encodeURIComponent(c.ch) + "&on=" + (c.fav ? 0 : 1));
        c.fav = !c.fav;
        render();
      } catch (err) { showMsg(t("Favourite: {e}", { e: err.message })); }
    };
    if (favsOn) li.appendChild(st);                    /* Favourites on in System Settings */
    li.onclick = () => tune("/tune?ch=" + encodeURIComponent(c.ch));
    list.appendChild(li);
  }
  if (!list.firstChild) {
    const none = favsOn && favOnly && !q && chans.length ? t("No favourites yet: tap \u2605 to show every channel, then \u2606 on one") : chans.length ? t("No match") : "";
    list.appendChild(el("li", "empty", none));
  }
}

async function loadChannels() {
  try {
    const j = await call("/channels");
    chans = j.channels;
    favsOn = !!j.favourites;
    $("favs").hidden = !favsOn;
    current = j.current;
    render();
    showMsg("");
  } catch (e) { showMsg(t("Channel list: {e}", { e: e.message })); }
}

async function refresh() {
  try {
    const s = await call("/status");
    $("num").textContent = s.ch;
    $("name").textContent = s.name;
    const c = chans.find(x => x.ch === s.ch);
    $("prog").textContent = s.now || (c && c.group) || " ";
    $("state").textContent = STATE[s.state] || s.state;
    $("state").className = "state " + s.state.replace(/\s/g, "");
    const p = c && c.now && c.now.title === s.now ? c.now : null;
    $("times").textContent = p ? hhmm(p.start) + " – " + hhmm(p.stop) : "";
    const nx = c && c.next && c.next.title === s.next ? c.next : null;
    $("nx").textContent = s.next ? t("Next") + (nx ? " " + hhmm(nx.start) : "") + "  " + s.next : "";
    setBar($("bar"), p);
    fillArt($("nowart"), c || { ch: s.ch }, p);
    const two = s.dual && s.screen2 && s.screen2.on;   /* focus switch while both screens play */
    $("focus").hidden = !two;
    if (two) { $("f1").className = s.focus === 1 ? "on" : ""; $("f2").className = s.focus === 2 ? "on" : ""; }
    $("pp").textContent = s.paused ? "\u25B6 " + t("PLAY") : "\u275A\u275A " + t("PAUSE");
    $("pp").setAttribute("aria-label", s.paused ? t("Play") : t("Pause"));
    $("pp").dataset.paused = s.paused ? "1" : "";
    $("live").textContent = s.behind > 0 ? t("LIVE ({t})", { t: "-" + Math.floor(s.behind / 60) + ":" + String(s.behind % 60).padStart(2, "0") }) : t("LIVE");
    $("live").className = s.behind > 0 ? "on" : "";
    const v = s.update_latest || "";               /* a newer RetroTV */
    const ut = { available: t("RetroTV {v} is available", { v }), downloading: t("Downloading RetroTV {v}\u2026", { v }),
                 installing: t("Installing RetroTV {v}\u2026", { v }), installed: t("RetroTV {v} installed: reopen RetroTV to use it", { v }),
                 restart: t("RetroTV {v} installed: restart ReplayOS to finish", { v }), failed: t("The update didn't install") }[s.update];
    $("upd").hidden = !ut;
    if (ut) {
      $("updtxt").textContent = ut;
      $("updbtn").hidden = !(s.update === "available" || s.update === "failed");
      $("updbtn").textContent = s.update === "failed" ? t("TRY AGAIN") : t("INSTALL");
    }
    if (s.ch !== current) { current = s.ch; render(); loadSettings(); }
    showMsg("");
  } catch (e) {
    $("state").textContent = t("offline");
    $("state").className = "state offline";
    showMsg(t("RetroTV isn't answering. Is it running? ({e})", { e: e.message }));
  }
}

async function tune(path) {
  try { await call(path); } catch (e) { showMsg(e.message); return; }
  setTimeout(refresh, 150);
  setTimeout(refresh, 1500);
}

/* ---------- settings ---------- */

function seg(id, choices, cur, param) {
  const box = $(id);
  box.textContent = "";
  if (!choices.length) { box.appendChild(el("span", "none", t("Only one track on this channel"))); return; }
  for (const [val, label] of choices) {
    const b = el("button", String(val) === String(cur) ? "on" : "", label);
    b.setAttribute("aria-pressed", String(val) === String(cur));
    b.onclick = () => change(param + "=" + encodeURIComponent(val) + (pic && PER_PICTURE.includes(param) ? "&screen=" + pic : ""));
    box.appendChild(b);
  }
}

function renderSettings() {
  const s = settings;
  if (!s) return;
  seg("s-sleep", s.sleep_steps.map(m => [m, m ? m + " min" : t("Off")]), s.sleep, "sleep");
  $("sleepleft").textContent = s.sleep && s.sleep_left ? t("{n} min left", { n: s.sleep_left }) : "";
  seg("s-audio", s.audio_tracks.length > 1 ? s.audio_tracks.map((l, i) => [i + 1, (i + 1) + (l ? " " + l.toUpperCase() : "")]) : [], s.audio, "audio");
  seg("s-leveller", [["off", t("Off")], ["normal", t("Normal")], ["loud", t("Loud")]], s.leveller, "leveller");
  seg("s-picture", [["fit", t("Fit")], ["zoom", t("Zoom")]], s.picture, "picture");
  seg("s-output", [["480", "640x480"], ["240", "240p"]], s.output, "output");
  $("r-output").hidden = !!s.dual;                  /* fixed picture size with two screens */
  $("r-screen2").hidden = !s.dual;
  if (s.dual) seg("s-screen2", [["off", t("Off")], ["on", t("On")]], s.screen2, "screen2");
  $("r-pic").hidden = !pic;
  if (pic) {                                         /* changes that picture without moving the sound */
    const box = $("s-pic");
    box.textContent = "";
    for (const n of [1, 2]) {
      const b = el("button", n === pic ? "on" : "", t("Screen {n}", { n }) + (n === s.focus ? " \u266A" : ""));
      b.setAttribute("aria-pressed", n === pic);
      b.onclick = () => { pic = n; loadSettings(); };
      box.appendChild(b);
    }
  }
}

async function loadSettings() {
  if ($("settings").hidden) return;
  try {
    let s = await call("/settings");
    if (s.dual && s.screen2 === "on") {
      if (!pic) pic = s.focus;
      if (pic !== s.focus) s = await call("/settings?screen=" + pic);
    } else pic = 0;
    settings = s;
    renderSettings();
  } catch (e) { showMsg(t("Settings: {e}", { e: e.message })); }
}

async function change(q) {
  try { await call("/set?" + q); } catch (e) { showMsg(e.message); return; }
  setTimeout(loadSettings, 300);                    /* applied on the TV's next frame */
  setTimeout(loadSettings, 1500);
}

$("gear").onclick = () => {
  const open = $("settings").hidden;
  $("settings").hidden = !open;
  $("gear").setAttribute("aria-expanded", open);
  if (open) { pic = 0; loadSettings(); }             /* opens on the screen you hear */
};
$("f1").onclick = () => tune("/focus?screen=1");
$("f2").onclick = () => tune("/focus?screen=2");
$("swap").onclick = () => tune("/swap");
$("updbtn").onclick = async () => {
  try { await call("/update?install=1"); } catch (e) { showMsg(e.message); return; }
  setTimeout(refresh, 300);
};
$("up").onclick = () => tune("/up");
$("down").onclick = () => tune("/down");
$("last").onclick = () => tune("/last");
$("pp").onclick = () => tune($("pp").dataset.paused ? "/play" : "/pause");
$("live").onclick = () => tune("/live");
$("find").oninput = e => { filter = e.target.value; render(); };
function showFavs() {
  $("favs").classList.toggle("on", favOnly);
  $("favs").setAttribute("aria-pressed", String(favOnly));
}
$("favs").onclick = () => {
  favOnly = !favOnly;
  try { localStorage.setItem("retrotv-favs", favOnly ? "1" : "0"); } catch (e) { /* private window */ }
  showFavs();
  render();
};
showFavs();

translatePage();
$("state").textContent = t("connecting");
loadChannels().then(refresh);
setInterval(refresh, 4000);
setInterval(loadSettings, 5000);
setInterval(loadChannels, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadChannels().then(refresh).then(loadSettings); });
</script>
</body>
</html>
